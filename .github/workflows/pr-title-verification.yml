name: Validate PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate title matches pattern
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|doc|refactor|test|build|ci|admin|revert):\s(\w+\s){2,}\(#\d+\)$/;

            if (!pattern.test(title)) {
              core.setFailed(
                `PR title "${title}" does not match required pattern: ${pattern}\n` +
                `Example: "<type>: <title> (#<issue_number>)"\n` +
                `Where <type> is one of: feat, fix, docs, refactor, test, build, ci, admin, revert\n` +
                `And <title> is a descriptive title with at least 2 words\n` +
                `And <issue_number> is the number of the related issue`
              );
            } else {
              core.info(`PR title OK: "${title}"`);
            }